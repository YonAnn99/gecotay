<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: "Geist", system-ui, -apple-system, sans-serif; }
    a { color: #364153; text-decoration: none; }
    a:hover { color: #101828; }
  </style>
</helmet>

<!-- 390x844. Objetivos de toque de 44px mínimo: se usa de pie, con una mano.
     Sin barra de estado ni teclado falsos. -->
<div style="width: 390px; height: 844px; background: #f9fafb; color: #111827; display: flex; flex-direction: column; overflow: hidden">

  <header style="border-bottom: 1px solid #e5e7eb; background: #ffffff; padding: 44px 20px 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <p style="margin: 0; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.2em; color: #aac637">Gecotay · Ventas</p>
      <span style="border: 1px solid #e5e7eb; border-radius: 8px; padding: 7px 12px; font-size: 13px; color: #364153">Salir</span>
    </div>
    <nav style="display: flex; gap: 20px; margin-top: 14px; font-size: 15px">
      <span style="color: #101828; font-weight: 500; border-bottom: 2px solid #aac637; padding-bottom: 6px">Catálogo</span>
      <a href="#" style="padding-bottom: 6px">Servicios</a>
      <a href="#" style="padding-bottom: 6px">Promociones</a>
    </nav>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 16px 20px 20px">

    <!-- Buscador: 48px de alto, tipo a 16px para que iOS no haga zoom. -->
    <div style="display: flex; align-items: center; gap: 10px; border: 1px solid #e5e7eb; background: #ffffff; border-radius: 12px; padding: 13px 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6a7282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <span style="font-size: 16px; color: #9ca3af">Buscar por nombre o característica…</span>
    </div>

    <!-- Aviso de promoción vigente: lo primero que necesita tener en la
         cabeza quien abre esto frente a un cliente. -->
    <div style="margin-top: 12px; border: 1px solid rgba(170, 198, 55, 0.45); background: rgba(170, 198, 55, 0.09); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <span style="background: #aac637; color: #10140d; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 5px 9px; flex-shrink: 0">15%</span>
      <div style="min-width: 0">
        <p style="margin: 0; font-size: 14px; font-weight: 500">Temporada de oficinas</p>
        <p style="margin: 2px 0 0; font-size: 12px; color: #4a5565">Vigente · quedan 9 días</p>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6a7282" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: auto; flex-shrink: 0"><path d="M9 6l6 6-6 6"/></svg>
    </div>

    <p style="margin: 16px 0 10px; font-size: 13px; color: #6a7282">20 de 20 líneas</p>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{lineas}}" as="l" hint-placeholder-count="4">
        <a href="#" style="display: block; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px; overflow: hidden">
          <div style="position: relative; aspect-ratio: 4 / 3; background: #f3f4f6">
            <img src="{{l.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
            <sc-if value="{{l.nuevo}}" hint-placeholder-val="{{true}}">
              <span style="position: absolute; top: 8px; left: 8px; background: #aac637; color: #10140d; font-size: 11px; font-weight: 600; border-radius: 9999px; padding: 3px 8px">Nuevo</span>
            </sc-if>
          </div>
          <div style="padding: 11px 12px 13px">
            <p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 1.3">{{l.nombre}}</p>
            <p style="margin: 5px 0 0; font-size: 13px; color: #4a5565">{{l.precio}}</p>
            <p style="margin: 2px 0 0; font-size: 12px; color: #6a7282">{{l.fotos}}</p>
          </div>
        </a>
      </sc-for>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      lineas: [
        { nombre: "Línea Ceri",     precio: "Desde $5,499", fotos: "4 fotos",  img: "ceri.webp",      nuevo: false },
        { nombre: "Línea Silver",   precio: "Desde $4,899", fotos: "4 fotos",  img: "silver.webp",    nuevo: false },
        { nombre: "Línea Chrome B", precio: "Desde $7,999", fotos: "3 fotos",  img: "crome-b.webp",   nuevo: false },
        { nombre: "Work Space",     precio: "Desde $9,999", fotos: "16 fotos", img: "workspace.webp", nuevo: true },
      ],
    };
  }
}
</script>
</body>
</html>
